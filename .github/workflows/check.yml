name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      # Prettier over the whole repository, from the root package's dev dependencies.
      - name: Typecheck, test and check the code style
        run: nix develop -c bash -c 'npm ci && npm run check && npm test && npm run format:check'

      # Builds the web app and the package, which also checks the npmDepsHash values.
      - name: Build
        run: nix build -L
